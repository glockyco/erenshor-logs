repos:
  # Prettier - Format web files (auto-fix)
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: pnpm --dir web run format
        language: system
        files: ^web/.*\.(js|ts|svelte|json|md|yaml|css|html)$
        pass_filenames: false

  # ESLint - Lint TypeScript/Svelte (auto-fix)
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: pnpm --dir web run lint:fix
        language: system
        files: ^web/.*\.(js|ts|svelte)$
        pass_filenames: false

  # CSharpier - Format C# (auto-fix)
  - repo: local
    hooks:
      - id: csharpier
        name: csharpier
        entry: dotnet csharpier
        language: system
        files: ^mod/.*\.cs$
        args: [.]
        pass_filenames: false

  # Gitleaks - Secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: mixed-line-ending
        args: [--fix=lf]
