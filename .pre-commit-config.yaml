repos:
  # Web: Format and lint staged files
  - repo: local
    hooks:
      - id: lint-staged-web
        name: lint-staged (web)
        entry: bash -c 'cd web && pnpm lint-staged'
        language: system
        files: ^web/
        pass_filenames: false

  # CSharpier - Format C# (auto-fix)
  - repo: local
    hooks:
      - id: csharpier
        name: csharpier
        entry: bash -c 'cd mod && dotnet csharpier . && git add -u .'
        language: system
        files: ^mod/.*\.cs$
        pass_filenames: false

  # Ruff - Format and lint Python (auto-fix)
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: bash -c 'uv run --directory cli ruff format && git add -u cli/'
        language: system
        files: ^cli/.*\.py$
        pass_filenames: false
      - id: ruff-lint
        name: ruff lint
        entry: bash -c 'uv run --directory cli ruff check --fix && git add -u cli/'
        language: system
        files: ^cli/.*\.py$
        pass_filenames: false

  # Mypy - Type check Python
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --directory cli mypy src
        language: system
        files: ^cli/.*\.py$
        pass_filenames: false

  # Gitleaks - Secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: mixed-line-ending
        args: [--fix=lf]
